<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="static/icon-192.png"><title>Customer Relationship Hub</title><style>
:root{--navy:#10243a;--blue:#245c83;--bg:#f3f6f8;--line:#d8e0e7}*{box-sizing:border-box}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:#172536}header{background:var(--navy);color:white;padding:18px max(16px,env(safe-area-inset-left));padding-top:calc(18px + env(safe-area-inset-top));position:sticky;top:0;z-index:2}header strong{font-size:18px}header small{display:block;opacity:.8;margin-top:4px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px;background:white;border-bottom:1px solid var(--line);position:sticky;top:77px;z-index:2}.tabs button{white-space:nowrap}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px #14283b0a}h1{font-size:24px;margin:8px 0 16px}h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:650;margin:10px 0;color:#34495e}input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid #bdc9d4;border-radius:9px;margin-top:5px;background:white;color:#172536}textarea{min-height:76px}button,.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--blue);color:white;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#e8eef3;color:#19334a}button.danger{background:#a83b3b}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.muted{color:#647789;font-size:13px}.empty{padding:18px;text-align:center;color:#647789}.photo{max-width:100%;max-height:220px;border-radius:8px;margin-top:8px}.hide{display:none!important}.notice{background:#fff6df;border:1px solid #e7d08a;border-radius:10px;padding:12px;font-size:13px;margin-bottom:14px}.stat{font-size:28px;font-weight:750}.statlabel{font-size:13px;color:#647789}.search{margin-bottom:10px}footer{text-align:center;color:#718091;font-size:12px;padding:22px}
</style></head><body><header><strong>Customer Relationship Hub</strong><small>Privé op dit toestel · geen account nodig</small></header><nav class="tabs"><button data-tab="dashboard">Overzicht</button><button data-tab="contacts">Contacten</button><button data-tab="companies">Bedrijven</button><button data-tab="tasks">Opvolging</button><button data-tab="backup">Back-up</button></nav><main class="wrap" id="app"></main><footer>Je gegevens blijven in de browser op dit toestel. Exporteer regelmatig een back-up.</footer><script>
const DB='crh_local_v1',STORE='records';let db,tab='dashboard',editing=null,photoData='';const app=document.querySelector('#app');
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function save(x){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite'),s=t.objectStore(STORE);x.id?s.put(x):s.add(x);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function remove(id){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(Number(id));t.oncomplete=res;t.onerror=()=>rej(t.error)})}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function records(data,type){return data.filter(x=>x.type===type)}function btn(label,fn,cls=''){return `<button class="${cls}" data-act="${fn}">${label}</button>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('secondary',b.dataset.tab!==tab));all().then(data=>{let contacts=records(data,'contact'),companies=records(data,'company'),tasks=records(data,'task');if(tab==='dashboard')app.innerHTML=`<h1>Overzicht</h1><div class="notice"><b>Belangrijk:</b> dit is een lokale versie. Gegevens worden niet naar de cloud gesynchroniseerd. Gebruik Back-up om je gegevens veilig te stellen.</div><div class="row"><section class="card"><div class="stat">${contacts.length}</div><div class="statlabel">Contacten</div></section><section class="card"><div class="stat">${companies.length}</div><div class="statlabel">Bedrijven</div></section><section class="card"><div class="stat">${tasks.filter(t=>t.status!=='Afgewerkt').length}</div><div class="statlabel">Open opvolgingen</div></section></div><section class="card"><h2>Snel toevoegen</h2><div class="row">${btn('＋ Contact','new-contact')}${btn('＋ Bedrijf','new-company')}${btn('＋ Opvolging','new-task')}</div></section><section class="card"><h2>Recente contacten</h2>${contacts.slice(-5).reverse().map(contactCard).join('')||'<div class="empty">Nog geen contacten toegevoegd.</div>'}</section>`;
if(tab==='contacts')app.innerHTML=`<h1>Contacten</h1><section class="card"><input class="search" id="q" placeholder="Zoek naam, bedrijf, e-mail…"><div id="list">${contacts.slice().reverse().map(contactCard).join('')||'<div class="empty">Nog geen contacten.</div>'}</div></section><section class="card"><h2 id="formtitle">Contact toevoegen</h2><form id="form"><input type="hidden" name="id"><label>Voornaam *<input name="first" required></label><label>Achternaam *<input name="last" required></label><label>Bedrijf<input name="company"></label><label>Functie<input name="job"></label><div class="row"><label>E-mail<input name="email" type="email"></label><label>Telefoon<input name="phone" type="tel"></label></div><label>LinkedIn<input name="linkedin" type="url"></label><label>Notities<textarea name="notes"></textarea></label><label>Foto visitekaartje (optioneel)<input id="photo" type="file" accept="image/*" capture="environment"></label><div class="row" style="margin:8px 0"><button type="button" id="scanCard" class="secondary">Visitekaartje uitlezen</button></div><p id="ocrStatus" class="muted">Neem een foto of kies een afbeelding en laat de gegevens herkennen.</p><div id="preview"></div><div class="row"><button type="submit">Contact bewaren</button><button type="button" class="secondary" data-act="clear-form">Leegmaken</button></div></form></section>`;
if(tab==='companies')app.innerHTML=`<h1>Bedrijven</h1><section class="card"><h2>Bedrijf toevoegen</h2><form id="form"><label>Bedrijfsnaam *<input name="name" required></label><label>Type relatie<select name="relation"><option>Prospect</option><option>Klant</option><option>Partner</option><option>Leverancier</option><option>Anders</option></select></label><label>Land<input name="country"></label><label>Website<input name="website" type="url"></label><label>Notities<textarea name="notes"></textarea></label><button type="submit">Bedrijf bewaren</button></form></section><section class="card"><h2>Bedrijvenlijst</h2>${companies.slice().reverse().map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="muted">${esc(c.relation||'Prospect')} · ${esc(c.country||'')}</div>${esc(c.website||'')}<div class="row" style="margin-top:8px">${btn('Verwijderen','delete-'+c.id,'danger')}</div></div>`).join('')||'<div class="empty">Nog geen bedrijven.</div>'}</section>`;
if(tab==='tasks')app.innerHTML=`<h1>Opvolging</h1><section class="card"><h2>Nieuwe opvolging</h2><form id="form"><label>Titel *<input name="title" required></label><label>Vervaldatum<input name="due" type="date"></label><label>Prioriteit<select name="priority"><option>Normaal</option><option>Hoog</option><option>Laag</option></select></label><label>Gekoppeld contact<input name="contact"></label><label>Notities<textarea name="notes"></textarea></label><button type="submit">Opvolging bewaren</button></form></section><section class="card"><h2>Opvolgingenlijst</h2>${tasks.slice().reverse().map(t=>`<div class="item"><b>${esc(t.title)}</b><div class="muted">${esc(t.due||'Geen datum')} · ${esc(t.priority||'Normaal')} · ${esc(t.status||'Open')}</div>${esc(t.notes||'')}<div class="row" style="margin-top:8px">${btn(t.status==='Afgewerkt'?'Opnieuw openen':'Markeer afgewerkt','toggle-'+t.id,'secondary')}${btn('Verwijderen','delete-'+t.id,'danger')}</div></div>`).join('')||'<div class="empty">Nog geen opvolgingen.</div>'}</section>`;
if(tab==='backup')app.innerHTML=`<h1>Back-up en gegevens</h1><section class="card"><h2>Back-up exporteren</h2><p>Bewaar een kopie van je contacten, bedrijven, opvolgingen en foto's. Doe dit regelmatig.</p><button data-act="export">Download back-up</button></section><section class="card"><h2>Back-up terugzetten</h2><p>Importeer een eerder geëxporteerd JSON-bestand. Dit vervangt de huidige gegevens.</p><label>Back-upbestand<input id="importfile" type="file" accept=".json,application/json"></label><button data-act="import">Back-up terugzetten</button></section><section class="card"><h2>Gegevens wissen</h2><p>Verwijdert alle CRM-gegevens uit deze browser op dit toestel.</p>${btn('Alles wissen','wipe','danger')}</section>`;
}).catch(e=>app.innerHTML='<section class="card">Er is een probleem met lokale opslag. Probeer Safari opnieuw te openen.</section>')}
function contactCard(c){return `<div class="item"><b>${esc(c.first)} ${esc(c.last)}</b><div class="muted">${esc(c.job||'')} ${c.company?'· '+esc(c.company):''}</div><div>${esc(c.email||'')} ${c.phone?'· '+esc(c.phone):''}</div>${c.photo?`<img class="photo" src="${c.photo}" alt="Foto visitekaartje">`:''}${c.notes?`<p>${esc(c.notes)}</p>`:''}<div class="row" style="margin-top:8px">${btn('Bewerken','edit-'+c.id,'secondary')}${btn('Verwijderen','delete-'+c.id,'danger')}</div></div>`}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editing=null;photoData='';render()});app.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;if(a.startsWith('new-')){tab='contacts';render();return}if(a.startsWith('delete-')){if(confirm('Dit item verwijderen?')){await remove(a.slice(7));render()}return}if(a.startsWith('toggle-')){let id=+a.slice(7),x=(await all()).find(r=>r.id===id);x.status=x.status==='Afgewerkt'?'Open':'Afgewerkt';await save(x);render();return}if(a==='clear-form'){app.querySelector('#form')?.reset();photoData='';app.querySelector('#preview').innerHTML='';return}if(a.startsWith('edit-')){let id=+a.slice(5),x=(await all()).find(r=>r.id===id);tab='contacts';render();setTimeout(()=>{let f=app.querySelector('#form');if(!f)return;Object.entries({id:x.id,first:x.first,last:x.last,company:x.company,job:x.job,email:x.email,phone:x.phone,linkedin:x.linkedin,notes:x.notes}).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v||''});photoData=x.photo||'';app.querySelector('#formtitle').textContent='Contact bewerken';if(photoData)app.querySelector('#preview').innerHTML=`<img class="photo" src="${photoData}" alt="Huidige visitekaartje">`;},20);return}if(a==='export'){let data=await all(),blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),records:data})],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='customer-relationship-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();URL.revokeObjectURL(url);return}if(a==='import'){let file=app.querySelector('#importfile').files[0];if(!file)return alert('Kies eerst een back-upbestand.');if(!confirm('Dit vervangt alle huidige gegevens. Doorgaan?'))return;let obj=JSON.parse(await file.text());if(!Array.isArray(obj.records))return alert('Dit bestand lijkt geen geldige back-up.');let tx=db.transaction(STORE,'readwrite'),s=tx.objectStore(STORE);s.clear();obj.records.forEach(r=>{let cp={...r};delete cp.id;s.add(cp)});tx.oncomplete=()=>{alert('Back-up teruggezet.');render()};return}if(a==='wipe'&&confirm('Alle gegevens definitief wissen? Exporteer eerst een back-up indien nodig.')){let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=()=>render()}});
app.addEventListener('change',e=>{if(e.target.id==='photo'){let f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('Kies een foto kleiner dan 5 MB.');e.target.value='';return}let r=new FileReader();r.onload=()=>{photoData=r.result;app.querySelector('#preview').innerHTML=`<img class="photo" src="${photoData}" alt="Voorbeeld visitekaartje">`;let st=app.querySelector('#ocrStatus');if(st)st.textContent='Foto klaar. Tik op “Visitekaartje uitlezen” om de tekst te herkennen.'};r.readAsDataURL(f)}if(e.target.id==='q'){let q=e.target.value.toLowerCase();app.querySelector('#list').innerHTML='';all().then(data=>{let cs=records(data,'contact').filter(c=>[c.first,c.last,c.company,c.email,c.phone].join(' ').toLowerCase().includes(q));app.querySelector('#list').innerHTML=cs.slice().reverse().map(contactCard).join('')||'<div class="empty">Geen resultaten.</div>'})}});
let ocrLoader=null;
function loadOCR(){if(window.Tesseract)return Promise.resolve(window.Tesseract);if(!ocrLoader)ocrLoader=new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>resolve(window.Tesseract);s.onerror=()=>reject(new Error('De gratis OCR-software kon niet worden geladen. Controleer je internetverbinding.'));document.head.appendChild(s)});return ocrLoader}
function prepareOCRImages(dataUrl){return new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>{const w=img.naturalWidth,h=img.naturalHeight;const crops=[[0,0,w,h],[w*.04,h*.25,w*.92,h*.55],[w*.02,h*.38,w*.96,h*.48],[w*.08,h*.15,w*.84,h*.65],[w*.04,h*.42,w*.92,h*.34],[w*.03,h*.48,w*.94,h*.28],[w*.02,h*.54,w*.96,h*.25],[w*.04,h*.58,w*.92,h*.22],[w*.02,h*.35,w*.96,h*.38]].map(a=>[Math.max(0,a[0]),Math.max(0,a[1]),Math.min(w-a[0],a[2]),Math.min(h-a[1],a[3])]);const make=(crop,mode)=>{let [x,y,cw,ch]=crop;let scale=Math.min(4,Math.max(2,2400/Math.max(cw,ch)));let c=document.createElement('canvas');c.width=Math.round(cw*scale);c.height=Math.round(ch*scale);let ctx=c.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,x,y,cw,ch,0,0,c.width,c.height);let im=ctx.getImageData(0,0,c.width,c.height),d=im.data;for(let i=0;i<d.length;i+=4){let v=.299*d[i]+.587*d[i+1]+.114*d[i+2];if(mode===1){v=(v-120)*1.9+128;v=Math.max(0,Math.min(255,v))}else if(mode===2){v=(v-145)*2.1+128;v=v>155?255:0}else if(mode===3){v=(v-110)*1.45+128;v=Math.max(0,Math.min(255,v))}d[i]=d[i+1]=d[i+2]=v}ctx.putImageData(im,0,0);return c.toDataURL('image/png')};let out=[];crops.forEach((crop,i)=>{out.push({src:make(crop,0),crop:i,mode:0});if(i===0||i===1||i===2||i===4||i===5||i===6||i===8){out.push({src:make(crop,1),crop:i,mode:1});out.push({src:make(crop,2),crop:i,mode:2})}});resolve(out)};img.onerror=()=>reject(new Error('De foto kon niet worden verwerkt. Probeer een andere foto.'));img.src=dataUrl})}
function fillFromCardText(text){
 const f=app.querySelector('#form');if(!f)return{};
 const norm=String(text||'').replace(/[“”]/g,'"').replace(/[’]/g,"'");
 const lines=norm.split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim().replace(/^[|:;,. \-]+|[|:;,. \-]+$/g,'')).filter(Boolean);
 const email=(norm.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'';
 const linkedin=(norm.match(/(?:https?:\/\/)?(?:www\.)?linkedin\.com\/[\w./-]+/i)||[])[0]||'';
 const phoneMatches=norm.match(/(?:\+\d{1,3}[ .()-]?)?(?:\(?\d{2,4}\)?[ .-]?)\d{3,4}[ .-]\d{2,4}/g)||[];
 const phone=phoneMatches.map(x=>x.trim()).sort((a,b)=>b.length-a.length)[0]||'';
 const set=(name,value)=>{if(f.elements[name])f.elements[name].value=value||''};
 // Clear fields first: uncertain OCR must never leave stale or fabricated details.
 ['first','last','company','job','email','phone','linkedin','notes'].forEach(n=>set(n,''));
 set('email',email);set('phone',phone);set('linkedin',linkedin?( /^https?:\/\//i.test(linkedin)?linkedin:'https://'+linkedin):'');
 const ignored=/^(www\.|https?:|linkedin|e-?mail|tel\.?|mobile|phone|fax|office|direct|address|ice\b|vat\b|reg\b|www\b)/i;
 const contactLine=/@|linkedin\.com|https?:\/\/|\b(?:tel|mobile|phone|fax|office|direct|e-?mail|ice)\b/i;
 const cleanLine=x=>x.length>=3&&x.length<=55&&!ignored.test(x)&&!contactLine.test(x)&&!/[\d@#$%{}\\[\]<>_=]/.test(x)&&/^[A-Za-zÀ-ÖØ-öø-ÿ'’.,&() -]+$/.test(x);
 const words=x=>x.match(/[A-Za-zÀ-ÖØ-öø-ÿ]+/g)||[];
 const plausibleWords=x=>{const ws=words(x);if(!ws.length)return false;return ws.every(w=>w.length>=2&&/[aeiouyàáâäèéêëìíîïòóôöùúûü]/i.test(w)&&!/^[A-Z]{1,2}$/.test(w))};
 const candidates=lines.filter(x=>cleanLine(x)&&plausibleWords(x));
 const roleWords=/\b(manager|director|chief|officer|president|sales|marketing|operations|operation|commercial|broker|agent|chartering|shipping|logistics|owner|founder|consultant|engineer|captain|superintendent|coordinator|executive|specialist|representative|account|procurement|trader|trading|finance|partner|tanker)\b/i;
 let job='';const jobIndex=candidates.findIndex(x=>roleWords.test(x)&&words(x).length<=7);if(jobIndex>=0)job=candidates.splice(jobIndex,1)[0];
 const companyHints=/shipping|shipmanagement|logistics|maritime|tankers|tanker|terminal|trading|chemicals|petrochem|transport|agency|marine|port|group|limited|\bltd\b|\binc\b|\bgmbh\b|\bbv\b|\bnv\b|pte\.?\s*ltd|corporation|\bco\b/i;
 let company='';const companyIndex=candidates.findIndex(x=>companyHints.test(x)&&words(x).length<=8);if(companyIndex>=0)company=candidates.splice(companyIndex,1)[0];
 // Only auto-fill a name when a short, clean two- or three-word line looks like a real name.
 const nameLine=candidates.find(x=>{const ws=words(x);return ws.length>=2&&ws.length<=3&&ws.every(w=>w.length>=2&&/^[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ'’-]+$/.test(w))&& !companyHints.test(x)&&!roleWords.test(x)});
 let first='',last='';if(nameLine){const parts=words(nameLine);first=parts.slice(0,-1).join(' ');last=parts[parts.length-1]}
 set('first',first);set('last',last);set('company',company);set('job',job);
 return{email,phone,company,person:first&&last?first+' '+last:'',job};
}
app.addEventListener('click',async e=>{
 const scanButton=e.target.closest('#scanCard');if(!scanButton)return;
 e.preventDefault();e.stopPropagation();
 let status=app.querySelector('#ocrStatus');
 if(!photoData){if(status)status.textContent='Neem eerst een foto of kies een afbeelding.';return}
 scanButton.disabled=true;if(status)status.textContent='Foto vergroten, contrast verbeteren en verschillende tekstversies herkennen…';
 try{
   let T=await loadOCR();let variants=await prepareOCRImages(photoData);
   let logger=m=>{let current=app.querySelector('#ocrStatus');if(current&&m.status==='recognizing text')current.textContent='Tekst herkennen… '+Math.round((m.progress||0)*100)+'%'};
   let attempts=[];let jobNo=0;
   for(const variant of variants){
     // Sparse text works better for many business cards; try both line and block modes.
     for(const psm of [11,6]){
       jobNo++;let result=await T.recognize(variant.src,'eng',{logger,tessedit_pageseg_mode:psm});
       let data=result.data||{},raw=data.text||'';
       let score=(data.confidence||0)*0.15+(raw.match(/@/g)||[]).length*18+(raw.match(/\+?\d[\d .()-]{6,}/g)||[]).length*5+(raw.match(/shipping|broker|partner|manager|director|tanker|email|mobile|office|direct|www/i)||[]).length*8+(raw.match(/[A-Za-z]{3,}/g)||[]).length*0.25;
       attempts.push({data,score,raw});
     }
   }
   // Merge unique OCR lines from all variants so a good email from one crop and a good name from another aren't discarded.
   attempts.sort((a,b)=>b.score-a.score);let seen=new Set(),merged=[];
   for(const a of attempts){for(const line of (a.raw||'').split(/\r?\n/)){let clean=line.replace(/\s+/g,' ').trim();let key=clean.toLowerCase().replace(/[^a-z0-9@.+]/g,'');if(clean.length>1&&key&&!seen.has(key)){seen.add(key);merged.push(clean)}}}
   let text=merged.join('\n');
   if(!text.trim()){let current=app.querySelector('#ocrStatus');if(current)current.textContent='Geen tekst herkend. Maak de kaart groter in beeld, leg hem vlak en zorg voor goed licht.';return}
   // If the view unexpectedly changed during OCR, reopen the contact form and apply the scan there.
   if(!app.querySelector('#form')||!app.querySelector('#scanCard')){
     tab='contacts';render();
     await new Promise(resolve=>setTimeout(resolve,120));
   }
   let found=fillFromCardText(text);
   let current=app.querySelector('#ocrStatus');
   if(current){current.textContent='Herkenning uitgevoerd met meerdere uitsneden en beeldverbeteringen. Controleer alle velden zorgvuldig vóór je opslaat. Notities blijven leeg.';if(!found.person||(!found.company&&!found.email&&!found.phone))current.textContent+=' De herkenning is onzeker. Onbetrouwbare naam-, bedrijfs- en functietekst is bewust leeg gelaten. Probeer een scherpere foto waarop alleen het kaartje groot in beeld staat.'}
 }catch(err){console.error('OCR mislukt:',err);let current=app.querySelector('#ocrStatus');if(current)current.textContent=err.message||'Herkenning mislukt. Probeer opnieuw.'}
